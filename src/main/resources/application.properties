spring.application.name=MascotasAPI

# Base de datos H2 almacenada en archivos para conservar los registros entre ejecuciones
spring.datasource.url=jdbc:h2:file:./data/mascotasdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza la tabla según la entidad JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (disponible mientras la aplicación está encendida)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
